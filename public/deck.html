<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchZone — Présentation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--c1:#f5c842;--c2:#ff6b35;--c3:#2ec4b6;--black:#0a0a0a;--white:#f5f0e8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--white);font-family:'Outfit',sans-serif;overflow:hidden;height:100vh;width:100vw;}
.deck{width:100vw;height:100vh;position:relative;}
.vslide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .55s ease,transform .55s ease;transform:translateY(20px);overflow:hidden;display:flex;}
.vslide.active{opacity:1;pointer-events:all;transform:translateY(0);}
.deck-nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:1000;background:rgba(10,10,10,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.07);padding:8px 20px;border-radius:999px;}
.dnav-btn{background:none;border:none;color:#444;cursor:pointer;font-size:18px;padding:4px 8px;transition:color .2s;}
.dnav-btn:hover{color:var(--white);}
.dnav-counter{font-family:'DM Mono',monospace;font-size:11px;color:#333;min-width:44px;text-align:center;}
.ddot{width:6px;height:6px;border-radius:50%;background:#222;cursor:pointer;transition:all .2s;}
.ddot.active{transform:scale(1.5);}
.dnav-dots{display:flex;gap:5px;}
.back-btn{position:fixed;top:16px;left:16px;z-index:1000;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;padding:7px 14px;background:rgba(10,10,10,.8);border:1px solid rgba(255,255,255,.1);color:#555;cursor:pointer;border-radius:2px;transition:all .2s;}
.back-btn:hover{border-color:var(--c1);color:var(--c1);}
.snum{position:absolute;top:22px;right:28px;font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.08);letter-spacing:2px;z-index:10;}

/* LAYOUTS */
.split{display:grid;grid-template-columns:1fr 1fr;height:100%;width:100%;}
.sl{display:flex;flex-direction:column;justify-content:center;padding:64px 52px;position:relative;overflow:hidden;}
.sr{display:flex;align-items:center;justify-content:center;padding:40px;position:relative;overflow:hidden;}
.full{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px;text-align:center;width:100%;height:100%;position:relative;overflow:hidden;}

/* TYPO */
.dtag{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;}
.dh1{font-family:'Playfair Display',serif;font-weight:900;line-height:1.0;margin-bottom:16px;}
.dh1 em{font-style:italic;}
.dbody{font-size:14px;line-height:1.75;font-weight:300;max-width:380px;color:rgba(255,255,255,.6);}

/* PILLS */
.dpills{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.dpill{display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:11px 14px;border-radius:4px;}
.dpill-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.dpill-text{font-size:13px;line-height:1.5;color:rgba(255,255,255,.65);}

/* PAIN */
.pain-list{display:flex;flex-direction:column;gap:18px;}
.pain-item{display:flex;gap:14px;align-items:flex-start;}
.pain-n{font-family:'Playfair Display',serif;font-size:44px;font-weight:900;line-height:1;min-width:44px;opacity:.1;}
.pain-body h4{font-size:15px;font-weight:600;margin-bottom:3px;}
.pain-body p{font-size:13px;line-height:1.6;color:#555;}

/* FLOW */
.flow{display:flex;gap:0;align-items:stretch;width:100%;max-width:720px;}
.flow-step{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:20px 14px;text-align:center;position:relative;}
.flow-step:not(:last-child)::after{content:'→';position:absolute;right:-11px;top:50%;transform:translateY(-50%);font-size:13px;z-index:2;color:rgba(255,255,255,.3);}
.fs-icon{font-size:24px;margin-bottom:8px;}
.fs-t{font-size:12px;font-weight:600;margin-bottom:3px;}
.fs-d{font-size:10px;color:#444;line-height:1.4;}

/* CAP */
.cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:1;}
.cap-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:26px 22px;position:relative;overflow:hidden;}
.cap-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.cap-letter{font-family:'Playfair Display',serif;font-size:52px;font-weight:900;line-height:1;margin-bottom:6px;opacity:.1;}
.cap-word{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
.cap-title{font-size:13px;font-weight:600;margin-bottom:5px;}
.cap-body{font-size:11px;color:#555;line-height:1.5;}
.cap-proof{margin-top:10px;font-family:'DM Mono',monospace;font-size:10px;display:flex;align-items:center;gap:4px;}

/* COMP TABLE */
.comp-table{width:100%;border-collapse:collapse;margin-top:24px;}
.comp-table th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#333;padding:0 14px 10px;text-align:left;}
.comp-table td{padding:12px 14px;border-top:1px solid rgba(255,255,255,.04);font-size:13px;color:#555;}
.comp-table tr.hl td{color:var(--white);background:rgba(255,255,255,.03);}
.comp-table tr.hl td:first-child{font-weight:600;}
.ck{color:var(--c3);}
.cx{color:#222;}

/* REV */
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:24px;}
.rev-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:24px 18px;}
.rev-icon{font-size:22px;margin-bottom:10px;}
.rev-title{font-size:12px;color:#555;margin-bottom:5px;}
.rev-amount{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;margin-bottom:3px;}
.rev-desc{font-size:11px;color:#333;line-height:1.5;}

/* TIMELINE */
.timeline{display:flex;gap:0;width:100%;max-width:680px;position:relative;margin-top:36px;}
.timeline::before{content:'';position:absolute;top:16px;left:32px;right:32px;height:1px;background:rgba(255,255,255,.08);}
.tl-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;}
.tl-dot{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:13px;position:relative;z-index:1;}
.tl-dot.now{box-shadow:0 0 16px rgba(245,200,66,.3);}
.tl-year{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;}
.tl-title{font-size:12px;font-weight:600;text-align:center;}
.tl-desc{font-size:10px;color:#444;text-align:center;line-height:1.4;}

/* STAT PILLS */
.stat-pills{display:flex;flex-direction:column;gap:10px;width:100%;max-width:240px;}
.stat-pill{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:11px 16px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;}
.sp-label{font-size:11px;color:#444;}
.sp-val{font-family:'DM Mono',monospace;font-size:14px;}

/* PHONE */
.phone-shell{width:180px;height:360px;background:#111;border:5px solid #1e1e1e;border-radius:36px;position:relative;overflow:hidden;box-shadow:0 0 0 1px #2a2a2a,0 40px 70px rgba(0,0,0,.7);}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:18px;background:#111;border-radius:0 0 12px 12px;z-index:10;}
.phone-inner{position:absolute;inset:0;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;}
.ph-status{height:32px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px 4px;font-size:7px;font-family:'DM Mono',monospace;}
.ph-header{padding:5px 12px 8px;border-bottom:1px solid rgba(255,255,255,.05);}
.ph-appname{font-family:'Playfair Display',serif;font-size:13px;font-weight:900;}
.ph-sub{font-size:6px;font-family:'DM Mono',monospace;opacity:.4;margin-top:1px;}
.ph-search{margin:6px 10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:5px;padding:5px 8px;font-size:7px;color:#333;display:flex;align-items:center;gap:3px;}
.ph-filters{display:flex;gap:4px;padding:0 10px 6px;overflow:hidden;}
.ph-chip{padding:2px 6px;border-radius:999px;font-size:6px;font-family:'DM Mono',monospace;background:rgba(255,255,255,.05);color:#2a2a2a;}
.ph-chip.on{color:#000;}
.ph-cards{flex:1;overflow:hidden;padding:0 10px;display:flex;flex-direction:column;gap:4px;}
.ph-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:7px;}
.phc-top{display:flex;justify-content:space-between;margin-bottom:3px;}
.phc-name{font-size:7px;font-weight:500;}
.phc-price{font-size:7px;font-family:'DM Mono',monospace;}
.phc-bar{height:2px;background:rgba(255,255,255,.05);border-radius:1px;overflow:hidden;margin-top:3px;}
.phc-fill{height:100%;border-radius:1px;}
.ph-nav{height:36px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-around;}
.ph-icon{font-size:12px;opacity:.2;}
.ph-icon.on{opacity:1;}

/* BROWSER */
.browser{width:100%;max-width:400px;background:#fff;border-radius:7px;box-shadow:0 30px 60px rgba(0,0,0,.25);overflow:hidden;}
.browser-bar{height:30px;background:#f0eeea;border-bottom:1px solid #e0ddd6;display:flex;align-items:center;gap:5px;padding:0 8px;}
.bwin{width:8px;height:8px;border-radius:50%;}
.burl{flex:1;background:#e4e1d9;border-radius:3px;height:16px;display:flex;align-items:center;padding:0 7px;font-family:'DM Mono',monospace;font-size:7px;color:#999;margin-left:3px;}
.web-hero-mini{padding:18px 14px;position:relative;overflow:hidden;}
.web-logo-mini{font-family:'Playfair Display',serif;font-size:12px;font-weight:900;margin-bottom:10px;}
.web-h{font-family:'Playfair Display',serif;font-size:14px;font-weight:900;line-height:1.1;margin-bottom:5px;}
.web-sub-mini{font-size:7px;line-height:1.5;margin-bottom:8px;opacity:.5;}
.web-cta-mini{display:inline-block;padding:4px 10px;border-radius:3px;font-size:7px;font-weight:700;font-family:'DM Mono',monospace;letter-spacing:1px;}
.web-feats{padding:10px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.wf{text-align:center;}
.wf-i{font-size:14px;margin-bottom:2px;}
.wf-t{font-size:6px;font-weight:600;margin-bottom:1px;}
.wf-d{font-size:5px;color:#999;line-height:1.3;}

/* IMAGE PRODUIT */
.product-image{max-width:100%;max-height:320px;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);}

/* GRAIN */
.grain{position:absolute;inset:0;opacity:.04;pointer-events:none;}

/* LOADING */
#loadingScreen{position:fixed;inset:0;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;text-align:center;gap:16px;}
.ld-dots{display:flex;gap:8px;justify-content:center;}
.ld{width:10px;height:10px;border-radius:50%;background:var(--c1);animation:bounce .8s ease-in-out infinite;}
.ld:nth-child(2){animation-delay:.15s;}.ld:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:scale(0.8);opacity:.4;}40%{transform:scale(1.2);opacity:1;}}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="ld-dots"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
  <div style="font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--c1);">Chargement du pitch…</div>
</div>

<button class="back-btn" onclick="history.back()">← Retour</button>

<div class="deck" id="deckContainer"></div>

<nav class="deck-nav">
  <button class="dnav-btn" onclick="prev()">←</button>
  <div class="dnav-dots" id="dnav-dots"></div>
  <div class="dnav-counter" id="dnav-counter">1 / 10</div>
  <button class="dnav-btn" onclick="next()">→</button>
</nav>

<script>
let cur = 0;
let fiche = null;
let id = null;
let slides = null;
const TOTAL = 10;

// Récupérer les paramètres
const params = new URLSearchParams(location.search);
const sessionCode = params.get('session');
const equipe = params.get('equipe');

async function init() {
  try {
    const r = await fetch(`/api/session/${sessionCode}`);
    const session = await r.json();
    fiche = session.fiches?.[equipe];
    if (!fiche) { document.getElementById('loadingScreen').innerHTML = '<div style="color:#e63946;font-family:DM Mono,monospace;">Fiche introuvable</div>'; return; }
    id = fiche.identity;
    slides = fiche.slides;
    // Appliquer palette
    if (id?.palette) {
      document.documentElement.style.setProperty('--c1', id.palette[0] || '#f5c842');
      document.documentElement.style.setProperty('--c2', id.palette[1] || '#ff6b35');
      document.documentElement.style.setProperty('--c3', id.palette[2] || '#2ec4b6');
    }
    buildDeck();
    document.getElementById('loadingScreen').style.display = 'none';
  } catch(e) {
    document.getElementById('loadingScreen').innerHTML = '<div style="color:#e63946;font-family:DM Mono,monospace;">Erreur de chargement</div>';
  }
}

function dk(hex, pct) {
  if (!hex || !hex.startsWith('#')) return '#111';
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const f=1-pct/100;
  return `#${Math.round(r*f).toString(16).padStart(2,'0')}${Math.round(g*f).toString(16).padStart(2,'0')}${Math.round(b*f).toString(16).padStart(2,'0')}`;
}
function lt(hex, pct) {
  if (!hex || !hex.startsWith('#')) return '#fff';
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const f=pct/100;
  return `#${Math.min(255,Math.round(r+(255-r)*f)).toString(16).padStart(2,'0')}${Math.min(255,Math.round(g+(255-g)*f)).toString(16).padStart(2,'0')}${Math.min(255,Math.round(b+(255-b)*f)).toString(16).padStart(2,'0')}`;
}

function grain() { return `<svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="gf"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg>`; }
function snum(n) { return `<div class="snum">${String(n).padStart(2,'0')} / 10</div>`; }

function buildDeck() {
  const c1=id?.palette?.[0]||'#f5c842';
  const c2=id?.palette?.[1]||'#ff6b35';
  const c3=id?.palette?.[2]||'#2ec4b6';
  const container = document.getElementById('deckContainer');
  const builders = [
    ()=>buildS1(slides[0],c1,c2,c3),
    ()=>buildS2(slides[1],c1,c2,c3),
    ()=>buildS3(slides[2],c1,c2,c3),
    ()=>buildS4(slides[3],c1,c2,c3),
    ()=>buildS5(slides[4],c1,c2,c3),
    ()=>buildS6(slides[5],c1,c2,c3),
    ()=>buildS7(slides[6],c1,c2,c3),
    ()=>buildS8(slides[7],c1,c2,c3),
    ()=>buildS9(slides[8],c1,c2,c3),
    ()=>buildS10(slides[9],c1,c2,c3),
  ];
  container.innerHTML = '';
  builders.forEach((b,i) => {
    const div = document.createElement('div');
    div.className = 'vslide' + (i===0?' active':'');
    div.id = 'vs'+i;
    try { div.innerHTML = b(); } catch(e) { div.innerHTML = `<div class="full" style="background:#111;"><div style="color:#e63946;font-family:DM Mono,monospace;font-size:12px;">Slide ${i+1} — erreur de rendu</div></div>`; }
    container.appendChild(div);
  });
  const dots = document.getElementById('dnav-dots');
  dots.innerHTML = '';
  for(let i=0;i<TOTAL;i++){
    const d=document.createElement('div');
    d.className='ddot'+(i===0?' active':'');
    d.style.background=i===0?c1:'#222';
    d.onclick=()=>go(i);
    dots.appendChild(d);
  }
}

function go(n){
  document.querySelectorAll('.vslide').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.ddot').forEach((d,i)=>{d.classList.remove('active');d.style.background='#222';});
  cur=Math.max(0,Math.min(n,TOTAL-1));
  document.getElementById('vs'+cur).classList.add('active');
  const dots=document.querySelectorAll('.ddot');
  dots[cur].classList.add('active');
  dots[cur].style.background=id?.palette?.[0]||'#f5c842';
  document.getElementById('dnav-counter').textContent=`${cur+1} / ${TOTAL}`;
}
function next(){go(cur+1);}
function prev(){go(cur-1);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')next();if(e.key==='ArrowLeft')prev();});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX);
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)dx<0?next():prev();});

// ── SLIDE BUILDERS ──

function buildS1(s,c1,c2,c3){
  const stats=(id?.stats||[{label:'Lancement',val:'2025'},{label:'Équipe',val:'4 pers.'},{label:'Marché',val:'En croissance'}]);
  return `<div style="background:linear-gradient(135deg,${dk(c1,60)} 0%,#0a0a0a 100%);height:100%;width:100%;position:relative;">
  ${snum(1)}${grain()}
  <div class="split">
    <div class="sl" style="z-index:1;">
      <div class="dtag" style="color:${c1};">PITCH INVESTISSEURS · 2025</div>
      <div class="dh1" style="font-size:clamp(44px,7vw,76px);color:${c1};">${id?.name||'Mon Enseigne'}</div>
      <div style="font-size:16px;font-weight:300;line-height:1.6;max-width:340px;margin-bottom:36px;border-left:2px solid ${c2};padding-left:14px;color:rgba(255,255,255,.5);">"${id?.slogan||'Notre slogan'}"</div>
      <div style="font-family:'DM Mono',monospace;font-size:10px;color:#2a2a2a;letter-spacing:1px;">Bac Pro Métiers de la Vente · ${new Date().getFullYear()} · ${equipe}</div>
    </div>
    <div class="sr" style="background:rgba(0,0,0,.2);z-index:1;flex-direction:column;gap:14px;">
      ${buildMockup(c1,c2,c3)}
      <div class="stat-pills">
        ${stats.map(st=>`<div class="stat-pill"><span class="sp-label">${st.label}</span><span class="sp-val" style="color:${c1};">${st.val}</span></div>`).join('')}
      </div>
    </div>
  </div></div>`;
}

function buildS2(s,c1,c2,c3){
  const pts=s?.points||['Problème 1','Problème 2','Problème 3'];
  return `<div style="background:#f7f3ec;height:100%;width:100%;position:relative;">
  ${snum(2).replace('rgba(255,255,255,.08)','rgba(13,17,23,.1)')}
  <div class="split" style="color:#0d1117;">
    <div class="sl" style="background:#0d1117;">
      <div class="dtag" style="color:${c1};">LE PROBLÈME</div>
      <div class="dh1" style="font-size:clamp(34px,5vw,58px);color:#f7f3ec;">Le marché a<br>un vrai<br><em style="color:${c1};">problème.</em></div>
    </div>
    <div class="sl" style="gap:0;">
      <div class="pain-list">
        ${pts.map((p,i)=>`<div class="pain-item">
          <div class="pain-n" style="color:${c2};">${String(i+1).padStart(2,'0')}</div>
          <div class="pain-body"><h4 style="color:#0d1117;">${p.split(':')[0]}</h4><p>${p.split(':')[1]||''}</p></div>
        </div>`).join('')}
      </div>
    </div>
  </div></div>`;
}

function buildS3(s,c1,c2,c3){
  const steps=s?.steps||['Étape 1','Étape 2','Étape 3','Étape 4'];
  const icons=['📝','🔗','🎯','🤝'];
  return `<div style="background:${dk(c1,68)};height:100%;width:100%;position:relative;">
  ${snum(3)}${grain()}
  <div class="full" style="z-index:1;">
    <div class="dtag" style="color:${c1};">LA SOLUTION</div>
    <div class="dh1" style="font-size:clamp(34px,5vw,58px);max-width:680px;">${s?.headline||'Une solution simple, un résultat <em style="color:'+c1+'">remarquable.</em>'}</div>
    <div style="font-size:15px;color:rgba(255,255,255,.35);max-width:480px;line-height:1.7;margin-bottom:44px;font-weight:300;">${id?.slogan||''}</div>
    <div class="flow" style="max-width:700px;width:100%;">
      ${steps.map((st,i)=>`<div class="flow-step">
        <div class="fs-icon">${icons[i%4]}</div>
        <div class="fs-t">${st.split(':')[0]}</div>
        <div class="fs-d">${st.split(':')[1]||''}</div>
      </div>`).join('')}
    </div>
  </div></div>`;
}

function buildS4(s,c1,c2,c3){

  <div style="background:linear-gradient(180deg,${dk(c1,55)} 0%,#0a0a0a 100%);border:1px solid rgba(255,255,255,.06);border-radius:4px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6);">
    <div style="background:linear-gradient(90deg,${c1},${c2});padding:12px 16px;display:flex;align-items:center;justify-content:space-between;">
      <div><div style="font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:#000;">${id?.name}</div><div style="font-size:7px;font-family:'DM Mono',monospace;color:rgba(0,0,0,.5);letter-spacing:2px;">${id?.secteur?.toUpperCase()?.substring(0,18)||''}</div></div>
      <div style="display:flex;gap:4px;"><div style="width:7px;height:7px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 5px #ff6b6b;"></div><div style="width:7px;height:7px;border-radius:50%;background:#ffd93d;"></div><div style="width:7px;height:7px;border-radius:50%;background:#6bcb77;box-shadow:0 0 5px #6bcb77;"></div></div>
    </div>
    <div style="padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;">
      ${['🎁','🛍️','⭐','💎','✨','🎯'].map((em,i)=>`<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:3px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:18px;">${em}</div>`).join('')}
    </div>
    <div style="background:linear-gradient(90deg,${c1},${c2});height:22px;display:flex;align-items:center;justify-content:center;">
      <div style="font-family:'DM Mono',monospace;font-size:7px;color:rgba(0,0,0,.6);letter-spacing:3px;">${id?.name?.toUpperCase()}</div>
    </div>
  </div></div>`;
}

init();
</script>
</body>
</html>
